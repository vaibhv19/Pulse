name: Pulse - Validation

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-k6:
    name: Validate k6 Scripts & Performance Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run k6 Smoke Test (Dry Run)
        uses: grafana/k6-action@v2
        with:
          filename: k6/main.js
          # Dry run of the core load scenario to validate scripts and budget gates resolution
          flags: --vus 1 --duration 1s
        env:
          PULSE_ENV: local
          PULSE_TARGET: phoenix
          PULSE_SCENARIO: load

      - name: Archive Performance Summary Reports
        uses: actions/upload-artifact@v4
        if: always() # Preserve logs and diagnostics even on budget violations
        with:
          name: pulse-performance-summary
          path: |
            summary.json
            summary.txt
          retention-days: 5
